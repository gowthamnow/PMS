name: Security Audit & SAST Scans

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 4 * * 1' # Weekly security audit on Monday at 04:00 UTC

jobs:
  secrets-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-sast-audit:
    name: Python SAST & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python SAST Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit semgrep pytest pytest-asyncio httpx -r backend/requirements.txt

      - name: Run Bandit SAST
        run: |
          bandit -r backend/app -ll -x tests

      - name: Run Pip-Audit (Vulnerabilities in Python Packages)
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln GHSA-w73w-5m7g-f7qc || true

      - name: Run Security Regression Test Suite
        env:
          TEST_DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "ci_testing_secret_key_minimum_32_characters_long_for_security"
        run: |
          pytest backend/tests/test_security_audit.py -v

  frontend-audit:
    name: Frontend Dependency & SAST Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Build Frontend (Type & Bundle Validation)
        run: npm run build

  container-scan:
    name: Container Vulnerability Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner (Repo Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
